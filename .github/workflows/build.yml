name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Build
              run: make build

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: servicewrapper-win
                  path: build/servicewrapper.exe
